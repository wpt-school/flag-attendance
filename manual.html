<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเช็คชื่อด้วยตนเอง (Manual) - กิจกรรมหน้าเสาธง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- ไลบรารีสแกน QR Code ผ่านกล้อง -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f1f3f4;
      margin: 0;
      padding: 15px 10px 40px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 600px;
      box-sizing: border-box;
    }
    .header-box {
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }
    h2 { color: #1a73e8; margin: 0 0 6px 0; font-size: 1.35em; }
    .date-badge {
      display: inline-block;
      background-color: #e8f0fe;
      color: #1967d2;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    .sub-note { font-size: 12px; color: #5f6368; margin-top: 6px; }

    /* โซนสแกน QR Code ในหน้า Manual */
    .qr-section {
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .qr-toggle-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #1a73e8;
      color: #ffffff;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .qr-toggle-btn:hover { background-color: #1557b0; }
    .qr-toggle-btn.active { background-color: #d93025; }
    .qr-toggle-btn.active:hover { background-color: #a50e0e; }

    #manual-qr-panel {
      display: none;
      margin-top: 10px;
    }
    #manual-qr-reader {
      width: 100%;
      max-width: 340px;
      margin: 0 auto 10px auto;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #1a73e8;
      background: #000;
    }
    .qr-input-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .qr-input-row input {
      flex: 1;
      padding: 9px 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      outline: none;
    }
    .qr-input-row button {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      background: #1e8e3e;
      color: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }
    .scan-feedback {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .scan-feedback.ok { background: #e6f4ea; color: #137333; border: 1px solid #1e8e3e; display: block; }
    .scan-feedback.warn { background: #fef7e0; color: #b06000; border: 1px solid #f29900; display: block; }
    .scan-feedback.err { background: #fce8e6; color: #c5221f; border: 1px solid #d93025; display: block; }

    /* แถบปุ่มเลือกทั้งหมด */
    .bulk-section {
      background-color: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .bulk-title { font-size: 13px; font-weight: 600; color: #3c4043; margin-bottom: 8px; text-align: center; }
    .bulk-btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .bulk-btn {
      padding: 9px 6px;
      border-radius: 8px;
      border: 1px solid #dadce0;
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .bulk-present { background-color: #e6f4ea; color: #137333; border-color: #ceead6; }
    .bulk-absent { background-color: #fce8e6; color: #c5221f; border-color: #fad2cf; }
    .bulk-activity { background-color: #fef7e0; color: #b06000; border-color: #fde293; }

    /* แถบสรุปจำนวน */
    .summary-bar {
      display: flex;
      justify-content: space-around;
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: 500;
    }

    /* รายการนักเรียน */
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .student-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background-color: #ffffff;
      transition: background-color 0.4s, border-color 0.4s;
    }
    .student-row.locked-row { background-color: #f8f9fa; border-color: #dadce0; }
    .student-row.just-scanned { background-color: #e6f4ea; border-color: #1e8e3e; }

    .stu-info { display: flex; flex-direction: column; text-align: left; padding-right: 8px; }
    .stu-main { font-size: 15px; font-weight: 500; color: #202124; }
    .stu-sub { font-size: 12px; color: #5f6368; }

    .status-controls { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .chk-btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid #dadce0;
      background-color: #ffffff;
      color: #5f6368;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .chk-btn.active-present { background-color: #1e8e3e; color: #ffffff; border-color: #1e8e3e; }
    .chk-btn.active-absent { background-color: #d93025; color: #ffffff; border-color: #d93025; }
    .activity-pill { background-color: #f29900; color: #ffffff; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }

    .locked-badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      background-color: #e8eaed;
      color: #3c4043;
      border: 1px solid #dadce0;
      cursor: not-allowed;
    }
    .locked-badge.leave-sick { background-color: #fce8e6; color: #c5221f; border-color: #f6aea9; }
    .locked-badge.leave-personal { background-color: #e8f0fe; color: #1967d2; border-color: #aecbfa; }
    .locked-badge.leave-activity { background-color: #fef7e0; color: #b06000; border-color: #fde293; }

    .action-footer { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
    .btn-save {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-family: 'Prompt', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      color: #ffffff;
      background-color: #1a73e8;
    }
    .btn-save:hover { background-color: #1557b0; }
    .btn-save-sync { background-color: #1e8e3e; }
    .btn-save-sync:hover { background-color: #137333; }
    .btn-save:disabled { background-color: #9aa0a6; cursor: not-allowed; }

    .alert-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      white-space: pre-line;
      display: none;
    }
    .alert-success { background-color: #e6f4ea; border: 1px solid #1e8e3e; color: #137333; display: block; }
    .alert-error { background-color: #fce8e6; border: 1px solid #d93025; color: #c5221f; display: block; }
    .alert-pending { background-color: #fef7e0; border: 1px solid #f29900; color: #b06000; display: block; }

    .nav-links { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    .nav-pill {
      font-size: 13px; color: #1a73e8; background: #e8f0fe;
      padding: 6px 12px; border-radius: 18px; text-decoration: none; font-weight: 500;
    }
    .footer { margin-top: 20px; font-size: 11px; color: #70757a; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-box">
      <h2>📋 เช็คชื่อด้วยตนเอง (Manual)</h2>
      <div id="dateDisplay" class="date-badge">⏳ กำลังโหลดข้อมูลวันนี้...</div>
      <div class="sub-note">* ระบบเปิดให้เช็คชื่อแบบวันต่อวันเท่านั้น (ไม่สามารถแก้ไขย้อนหลังได้)</div>
    </div>

    <div id="controlPanel" style="display: none;">
      <!-- โซนสแกน QR Code เช็คชื่อ "มา" อัตโนมัติ -->
      <div class="qr-section">
        <button type="button" id="manualQrBtn" class="qr-toggle-btn" onclick="toggleManualScanner()">
          📷 เปิดกล้องสแกน QR Code เช็คชื่อ
        </button>
        <div id="manual-qr-panel">
          <div id="manual-qr-reader"></div>
          <div class="qr-input-row">
            <input type="text" id="manualQrInput" placeholder="หรือยิงเครื่องสแกน / พิมพ์รหัสนักเรียน...">
            <button type="button" onclick="handleManualInputScan()">เช็คมา</button>
          </div>
        </div>
        <div id="scanFeedback" class="scan-feedback"></div>
      </div>

      <!-- ปุ่มลัดเลือกทั้งหมด -->
      <div class="bulk-section">
        <div class="bulk-title">⚡ เลือกสถานะอย่างรวดเร็ว (ไม่กระทบผู้ที่ลากิจ / ลาป่วย / กิจกรรมเดิม)</div>
        <div class="bulk-btn-group">
          <button type="button" class="bulk-btn bulk-present" onclick="applyBulkStatus('มา')">✅ "มา" ทั้งหมด</button>
          <button type="button" class="bulk-btn bulk-absent" onclick="applyBulkStatus('ขาด')">❌ "ขาด" ทั้งหมด</button>
          <button type="button" class="bulk-btn bulk-activity" onclick="applyBulkStatus('เข้าร่วมกิจกรรม')">🚩 "เข้าร่วมกิจกรรม" ทั้งหมด</button>
        </div>
      </div>

      <!-- สรุปยอดนักเรียน -->
      <div class="summary-bar">
        <div style="color: #137333;">มา: <span id="sumPresent">0</span></div>
        <div style="color: #c5221f;">ขาด: <span id="sumAbsent">0</span></div>
        <div style="color: #b06000;">ลา/กิจกรรม: <span id="sumLeave">0</span></div>
      </div>

      <!-- รายชื่อนักเรียน -->
      <div id="studentList" class="student-list"></div>

      <!-- ปุ่มบันทึกข้อมูล -->
      <div class="action-footer">
        <button id="saveSheetBtn" type="button" class="btn-save" onclick="submitManualCheck(false)">
          💾 บันทึกการเช็คชื่อ (ลง Google Sheet)
        </button>
        <button id="saveAndSyncBtn" type="button" class="btn-save btn-save-sync" onclick="submitManualCheck(true)">
          🌐 บันทึก + ซิงค์ไปเว็บโรงเรียน (ทั้งห้อง)
        </button>
      </div>
    </div>

    <div id="alertBox" class="alert-box"></div>
    <div id="navLinks" class="nav-links"></div>
  </div>

  <div class="footer">จัดทำโดย คุณครูธนโชติ จันทรังษี โรงเรียนวาปีปทุม</div>

  <script>
    // ================== ตั้งค่า URL Web App ของ Google Apps Script ==================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby_viWHAUinPqVIxt0zSA7vGy0Bvq0u-4aNZ6AgOX05kWGlAszQ4Yu3ItcIlixij_kryQ/exec";
    const IS_GAS = (typeof google !== "undefined" && google.script && google.script.run);

    let studentsData = [];
    let qrToStudentId = {};
    let manualQrScanner = null;
    let isManualCamRunning = false;
    let lastCode = "";
    let lastCodeTime = 0;

    window.onload = function() {
      setupNavLinks();
      loadTodayData();
      document.getElementById("manualQrInput").addEventListener("keyup", function(e) {
        if (e.key === "Enter") handleManualInputScan();
      });
    };

    function setupNavLinks() {
      const navEl = document.getElementById("navLinks");
      if (!IS_GAS) {
        navEl.innerHTML = `
          <a href="index.html" class="nav-pill">📷 หน้าสแกนหลัก</a>
          <a href="leave.html" class="nav-pill">📝 แจ้งลาออนไลน์</a>
        `;
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById("alertBox");
      box.textContent = msg;
      box.className = "alert-box alert-" + type;
    }

    function showScanFeedback(msg, type) {
      const fb = document.getElementById("scanFeedback");
      fb.textContent = msg;
      fb.className = "scan-feedback " + type;
    }

    function playBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1050, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    async function loadTodayData() {
      try {
        let res;
        if (IS_GAS) {
          res = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getManualAttendanceData();
          });
        } else {
          const response = await fetch(`${GAS_API_URL}?action=getManualData`, { method: "GET", redirect: "follow" });
          res = await response.json();
        }

        if (res.todayDisplay) {
          const roomText = res.roomName ? `ห้อง ${res.roomName} | ` : "";
          document.getElementById("dateDisplay").textContent = `📅 ${roomText}${res.todayDisplay}`;
        }

        if (res.status === "success") {
          studentsData = res.students || [];
          qrToStudentId = res.qrToStudentId || {};
          renderStudentList();
          document.getElementById("controlPanel").style.display = "block";
        } else {
          showAlert("❌ " + (res.message || "โหลดข้อมูลไม่สำเร็จ"), "error");
        }
      } catch (err) {
        showAlert("❌ ไม่สามารถโหลดข้อมูลได้ กรุณารีเฟรชหน้าเว็บหรือตรวจสอบ GAS_API_URL", "error");
      }
    }

    // ==================== ระบบสแกน QR Code ในหน้า Manual ====================
    async function toggleManualScanner() {
      if (isManualCamRunning) {
        await stopManualScanner();
      } else {
        await startManualScanner();
      }
    }

    async function startManualScanner() {
      if (typeof Html5Qrcode === "undefined") {
        showScanFeedback("❌ ไม่สามารถโหลดไลบรารีสแกน QR Code ได้", "err");
        return;
      }

      const btn = document.getElementById("manualQrBtn");
      const panel = document.getElementById("manual-qr-panel");
      btn.disabled = true;
      btn.textContent = "⏳ กำลังเปิดกล้อง...";
      panel.style.display = "block";

      try {
        if (!manualQrScanner) {
          manualQrScanner = new Html5Qrcode("manual-qr-reader");
        }

        const config = { fps: 10, qrbox: { width: 210, height: 210 } };
        const onSuccess = (decodedText) => {
          const code = decodedText.trim();
          const now = Date.now();
          if (code === lastCode && (now - lastCodeTime) < 2500) return;
          lastCode = code;
          lastCodeTime = now;
          processManualQrCode(code);
        };

        try {
          await manualQrScanner.start({ facingMode: "environment" }, config, onSuccess, () => {});
        } catch (envErr) {
          const cameras = await Html5Qrcode.getCameras();
          if (!cameras || cameras.length === 0) throw new Error("ไม่พบกล้องในอุปกรณ์นี้");
          await manualQrScanner.start(cameras[0].id, config, onSuccess, () => {});
        }

        isManualCamRunning = true;
        btn.disabled = false;
        btn.classList.add("active");
        btn.textContent = "⏹️ ปิดกล้องสแกน QR Code";
      } catch (err) {
        btn.disabled = false;
        btn.classList.remove("active");
        btn.textContent = "📷 เปิดกล้องสแกน QR Code เช็คชื่อ";
        showScanFeedback("❌ เปิดกล้องไม่สำเร็จ (ยังพิมพ์รหัสหรือใช้เครื่องสแกน USB ในช่องด้านบนได้): " + (err.message || ""), "err");
      }
    }

    async function stopManualScanner() {
      const btn = document.getElementById("manualQrBtn");
      const panel = document.getElementById("manual-qr-panel");
      if (manualQrScanner && isManualCamRunning) {
        try {
          await manualQrScanner.stop();
          await manualQrScanner.clear();
        } catch (e) {}
      }
      isManualCamRunning = false;
      panel.style.display = "none";
      btn.classList.remove("active");
      btn.textContent = "📷 เปิดกล้องสแกน QR Code เช็คชื่อ";
    }

    function handleManualInputScan() {
      const inputEl = document.getElementById("manualQrInput");
      const code = inputEl.value.trim();
      if (!code) return;
      inputEl.value = "";
      processManualQrCode(code);
    }

    function processManualQrCode(rawCode) {
      const mappedStudentId = qrToStudentId[rawCode] || rawCode;
      const idx = studentsData.findIndex(stu =>
        stu.studentId === mappedStudentId || stu.studentId === rawCode
      );

      if (idx === -1) {
        showScanFeedback(`❌ ไม่พบนักเรียนรหัส "${rawCode}" ในรายชื่อห้องนี้`, "err");
        return;
      }

      const stu = studentsData[idx];
      playBeep();

      if (stu.isLocked) {
        showScanFeedback(`🔒 เลขที่ ${stu.no} ${stu.name} มีสถานะ "${stu.status}" อยู่แล้ว (ถูกล็อก)`, "warn");
        renderStudentList(stu.row);
        return;
      }

      stu.status = "มา";
      renderStudentList(stu.row);
      showScanFeedback(`✅ เช็คชื่อ "มา" ให้ เลขที่ ${stu.no} ${stu.name} (อย่าลืมกดปุ่มบันทึกด้านล่างเมื่อเช็คครบ)`, "ok");
    }

    // ==================== แสดงผลและจัดการรายชื่อ ====================
    function renderStudentList(highlightRow) {
      const listEl = document.getElementById("studentList");
      listEl.innerHTML = "";
      let targetRowEl = null;

      studentsData.forEach((stu, idx) => {
        const rowDiv = document.createElement("div");
        const isHighlighted = (highlightRow && stu.row === highlightRow);
        rowDiv.className = "student-row" + (stu.isLocked ? " locked-row" : "") + (isHighlighted ? " just-scanned" : "");
        if (isHighlighted) targetRowEl = rowDiv;

        const infoDiv = document.createElement("div");
        infoDiv.className = "stu-info";
        infoDiv.innerHTML = `
          <div class="stu-main">เลขที่ ${stu.no} ${stu.name}</div>
          <div class="stu-sub">รหัสประจำตัว: ${stu.studentId}</div>
        `;

        const ctrlDiv = document.createElement("div");
        ctrlDiv.className = "status-controls";

        if (stu.isLocked) {
          let badgeClass = "locked-badge";
          if (stu.status === "ลาป่วย") badgeClass += " leave-sick";
          else if (stu.status === "ลากิจ") badgeClass += " leave-personal";
          else if (stu.status === "เข้าร่วมกิจกรรม") badgeClass += " leave-activity";
          ctrlDiv.innerHTML = `<span class="${badgeClass}">🔒 ${stu.status}</span>`;
        } else {
          const isPresent = stu.status === "มา";
          const isAbsent = stu.status === "ขาด";
          const isBulkActivity = stu.status === "เข้าร่วมกิจกรรม";

          let htmlCtrl = isBulkActivity ? `<span class="activity-pill">🚩 เข้าร่วมกิจกรรม</span>` : "";
          htmlCtrl += `
            <button type="button" class="chk-btn ${isPresent ? 'active-present' : ''}" onclick="setStudentStatus(${idx}, 'มา')">มา</button>
            <button type="button" class="chk-btn ${isAbsent ? 'active-absent' : ''}" onclick="setStudentStatus(${idx}, 'ขาด')">ขาด</button>
          `;
          ctrlDiv.innerHTML = htmlCtrl;
        }

        rowDiv.appendChild(infoDiv);
        rowDiv.appendChild(ctrlDiv);
        listEl.appendChild(rowDiv);
      });

      updateSummaryCounts();

      if (targetRowEl) {
        targetRowEl.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    function setStudentStatus(index, newStatus) {
      if (!studentsData[index] || studentsData[index].isLocked) return;
      studentsData[index].status = newStatus;
      renderStudentList();
    }

    function applyBulkStatus(targetStatus) {
      studentsData.forEach(stu => {
        if (!stu.isLocked) stu.status = targetStatus;
      });
      renderStudentList();
    }

    function updateSummaryCounts() {
      let present = 0, absent = 0, leaveOrAct = 0;
      studentsData.forEach(stu => {
        if (stu.status === "มา") present++;
        else if (stu.status === "ขาด") absent++;
        else leaveOrAct++;
      });
      document.getElementById("sumPresent").textContent = present;
      document.getElementById("sumAbsent").textContent = absent;
      document.getElementById("sumLeave").textContent = leaveOrAct;
    }

    async function submitManualCheck(syncToWeb) {
      const saveBtn = document.getElementById("saveSheetBtn");
      const syncBtn = document.getElementById("saveAndSyncBtn");
      saveBtn.disabled = true;
      syncBtn.disabled = true;

      showAlert(
        syncToWeb ? "⏳ กำลังบันทึกลง Google Sheet และซิงค์ไปเว็บโรงเรียน..." : "⏳ กำลังบันทึกข้อมูลลง Google Sheet...",
        "pending"
      );

      const payload = studentsData
        .filter(stu => !stu.isLocked)
        .map(stu => ({ row: stu.row, status: stu.status }));

      try {
        let res;
        if (IS_GAS) {
          res = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveManualAttendanceData(payload, syncToWeb);
          });
        } else {
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "saveManualAttendance", records: payload, syncToSchoolWeb: syncToWeb }),
            redirect: "follow"
          });
          res = await response.json();
        }

        if (res && res.status === "success") {
          showAlert("✅ " + res.message, "success");
          loadTodayData();
        } else {
          showAlert("❌ " + (res ? res.message : "บันทึกไม่สำเร็จ"), "error");
        }
      } catch (err) {
        showAlert("❌ การเชื่อมต่อขัดข้อง กรุณากดบันทึกใหม่อีกครั้ง", "error");
      } finally {
        saveBtn.disabled = false;
        syncBtn.disabled = false;
      }
    }
  </script>
</body>
