<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสแกนเช็คชื่อ การเข้าร่วมกิจกรรมหน้าเสาธง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f1f3f4;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background-color: #ffffff;
      padding: 26px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-sizing: border-box;
    }
    h2 { color: #1a73e8; margin-top: 0; margin-bottom: 10px; font-size: 1.45em; line-height: 1.3; }
    .db-status {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 14px;
      padding: 5px 12px;
      background: #f8f9fa;
      border-radius: 20px;
      display: inline-block;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 18px;
      font-family: 'Prompt', sans-serif;
      outline: none;
      box-sizing: border-box;
      text-align: center;
    }
    input:focus { border: 2px solid #1a73e8; }
    button {
      width: 100%;
      background-color: #1a73e8;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Prompt', sans-serif;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #1557b0; }
    button:disabled { background-color: #9aa0a6; cursor: not-allowed; }

    .btn-camera {
      margin-top: 10px;
      background-color: #3c4043;
    }
    .btn-camera:hover { background-color: #202124; }

    .btn-sync-web {
      margin-top: 12px;
      background-color: #1e8e3e;
    }
    .btn-sync-web:hover { background-color: #137333; }

    #result-area, #sync-status-area {
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      display: none;
      transition: all 0.3s;
    }
    .student-name { font-size: 20px; font-weight: 500; color: #202124; margin: 5px 0; }
    .student-no { font-size: 15px; color: #5f6368; }

    .success { background-color: #e6f4ea; border: 1px solid #1e8e3e; color: #137333; display: block !important; }
    .error { background-color: #fce8e6; border: 1px solid #d93025; color: #c5221f; display: block !important; }
    .pending { background-color: #fef7e0; border: 1px solid #f29900; color: #b06000; display: block !important; }

    .divider { border-top: 1px solid #e0e0e0; margin: 18px 0 12px 0; }
    .nav-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .nav-pill {
      font-size: 13px;
      color: #1a73e8;
      background: #e8f0fe;
      padding: 6px 12px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-pill:hover { background: #d2e3fc; }
    .btn-report { display: block; margin-top: 14px; color: #1a73e8; text-decoration: none; font-size: 14px; }
    .footer { margin-top: 24px; font-size: 11px; color: #70757a; }

    /* ==================== หน้าต่างสแกน QR Code แบบเต็มจอ ==================== */
    .qr-fullscreen-modal {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      z-index: 9999;
      flex-direction: column;
      overflow: hidden;
    }
    .qr-fullscreen-modal.open {
      display: flex;
    }
    .qr-camera-stage {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #qr-reader {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }
    #qr-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    /* แถบเครื่องมือด้านบนของหน้าจอสแกน */
    .qr-top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 14px 20px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.78), rgba(0,0,0,0));
      gap: 8px;
    }
    .qr-top-title {
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    .qr-top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .qr-ctrl-btn {
      width: auto;
      padding: 9px 14px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(32, 33, 36, 0.78);
      color: #ffffff;
      backdrop-filter: blur(6px);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .qr-ctrl-btn:hover { background: rgba(60, 64, 67, 0.9); }
    .qr-ctrl-btn.torch-on {
      background: #f9ab00;
      color: #202124;
      border-color: #f9ab00;
    }
    .qr-ctrl-btn.btn-close-cam {
      background: rgba(217, 48, 37, 0.92);
      border-color: rgba(217, 48, 37, 0.95);
    }
    .qr-ctrl-btn.btn-close-cam:hover { background: #b31412; }

    /* การ์ดแสดงข้อมูลนักเรียนที่เพิ่งสแกนบนหน้าจอเต็มจอ */
    .qr-scan-toast {
      position: absolute;
      top: 72px;
      left: 14px;
      right: 14px;
      z-index: 25;
      padding: 12px 16px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .qr-scan-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .qr-scan-toast.ok {
      background: rgba(230, 244, 234, 0.96);
      border: 2px solid #1e8e3e;
      color: #137333;
    }
    .qr-scan-toast.err {
      background: rgba(252, 232, 230, 0.96);
      border: 2px solid #d93025;
      color: #c5221f;
    }
    .qr-toast-status { font-size: 13px; font-weight: 600; }
    .qr-toast-name { font-size: 19px; font-weight: 600; color: #202124; margin: 2px 0; }
    .qr-toast-sub { font-size: 14px; color: #3c4043; }

    /* แถบควบคุมการซูมด้านล่าง */
    .qr-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 18px 16px 24px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 70%, rgba(0,0,0,0));
      color: #ffffff;
    }
    .zoom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .zoom-presets {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .zoom-pill {
      width: auto;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 13px;
      background: rgba(255,255,255,0.18);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.28);
    }
    .zoom-pill.active {
      background: #1a73e8;
      border-color: #8ab4f8;
    }
    .zoom-slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zoom-slider-row input[type="range"] {
      flex: 1;
      accent-color: #1a73e8;
      height: 6px;
    }
    .zoom-note {
      font-size: 12px;
      color: #bdc1c6;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>ระบบสแกนเช็คชื่อ<br>กิจกรรมหน้าเสาธง</h2>
    <div id="dbStatus" class="db-status">⏳ กำลังโหลดรายชื่อนักเรียน...</div>

    <input type="text" id="qrInput" placeholder="สแกนรหัสหรือพิมพ์ที่นี่..." autofocus>
    <button type="button" onclick="handleManualSaveClick()">💾 บันทึกข้อมูล</button>

    <!-- ปุ่มเปิดกล้องเต็มจอ -->
    <button type="button" id="openCameraBtn" class="btn-camera" onclick="openFullscreenScanner()">
      📷 เปิดกล้องสแกน QR Code (เต็มจอ)
    </button>

    <div id="result-area">
      <div id="status-text" style="font-size: 14px; font-weight: bold;"></div>
      <div id="displayName" class="student-name"></div>
      <div id="displayNo" class="student-no"></div>
    </div>

    <div class="divider"></div>

    <button type="button" id="syncWebBtn" class="btn-sync-web" onclick="syncAllToSchoolWeb()">
      🌐 ซิงค์เช็คชื่อวันนี้ไปเว็บโรงเรียน (ทั้งห้อง)
    </button>

    <div id="sync-status-area">
      <div id="sync-status-title" style="font-size: 15px; font-weight: 600;"></div>
      <div id="sync-status-detail" style="font-size: 13px; margin-top: 4px;"></div>
    </div>

    <div id="navLinks" class="nav-links"></div>

    <a href="https://script.google.com/macros/s/AKfycbyAIL3G-ffpuwjgkIfo74Sz-iPRTIHiIldN9p4bpOV5BaTPYyWur7uyO_5ZLwcgLuIXLQ/exec" target="_blank" class="btn-report">
      📊 รายงานการเข้าร่วมกิจกรรม
    </a>
  </div>

  <div class="footer">จัดทำโดย คุณครูธนโชติ จันทรังษี โรงเรียนวาปีปทุม</div>

  <!-- ==================== หน้าต่างกล้องสแกน QR Code เต็มจอ ==================== -->
  <div id="qrFullscreenModal" class="qr-fullscreen-modal" aria-hidden="true">
    <div class="qr-camera-stage">
      <div id="qr-reader"></div>

      <!-- แถบด้านบน: ชื่อ + ปุ่มไฟฉาย + ปุ่มปิดกล้อง -->
      <div class="qr-top-bar">
        <div class="qr-top-title">📷 สแกนเช็คชื่อ</div>
        <div class="qr-top-actions">
          <button type="button" id="torchBtn" class="qr-ctrl-btn" onclick="toggleTorch()">
            🔦 ไฟฉาย
          </button>
          <button type="button" class="qr-ctrl-btn btn-close-cam" onclick="closeFullscreenScanner()">
            ✕ ปิดกล้อง
          </button>
        </div>
      </div>

      <!-- การ์ดแสดงข้อมูลนักเรียนขณะสแกน -->
      <div id="qrScanToast" class="qr-scan-toast">
        <div id="qrToastStatus" class="qr-toast-status"></div>
        <div id="qrToastName" class="qr-toast-name"></div>
        <div id="qrToastSub" class="qr-toast-sub"></div>
      </div>

      <!-- แถบควบคุมการซูมด้านล่าง -->
      <div class="qr-bottom-bar">
        <div id="zoomControlsBox">
          <div class="zoom-header">
            <span>🔍 ซูมกล้อง</span>
            <span id="zoomValueLabel">1.0x</span>
          </div>
          <div class="zoom-presets" id="zoomPresets">
            <button type="button" class="zoom-pill active" onclick="setZoomLevel(1)">1x</button>
            <button type="button" class="zoom-pill" onclick="setZoomLevel(1.5)">1.5x</button>
            <button type="button" class="zoom-pill" onclick="setZoomLevel(2)">2x</button>
            <button type="button" class="zoom-pill" onclick="setZoomLevel(3)">3x</button>
          </div>
          <div class="zoom-slider-row">
            <span>−</span>
            <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1" oninput="setZoomLevel(parseFloat(this.value))">
            <span>+</span>
          </div>
        </div>
        <div id="zoomUnsupportedNote" class="zoom-note" style="display: none;">
          อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการซูมเลนส์กล้องอัตโนมัติ
        </div>
      </div>
    </div>
  </div>

  <script>
    // ================== ตั้งค่า URL Web App ของ Google Apps Script ==================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby_viWHAUinPqVIxt0zSA7vGy0Bvq0u-4aNZ6AgOX05kWGlAszQ4Yu3ItcIlixij_kryQ/exec";
    const IS_GAS = (typeof google !== "undefined" && google.script && google.script.run);

    let studentMap = {};
    let html5QrCode = null;
    let isCameraRunning = false;
    let activeVideoTrack = null;
    let isTorchOn = false;
    let torchSupported = false;
    let zoomSupported = false;
    let zoomRange = { min: 1, max: 1, step: 0.1 };

    let lastScannedCode = "";
    let lastScannedTime = 0;
    let toastTimer = null;
    let sharedAudioCtx = null;

    const input = document.getElementById("qrInput");
    const dbStatus = document.getElementById("dbStatus");
    const resArea = document.getElementById("result-area");
    const statusText = document.getElementById("status-text");
    const nameText = document.getElementById("displayName");
    const noText = document.getElementById("displayNo");

    const syncBtn = document.getElementById("syncWebBtn");
    const syncArea = document.getElementById("sync-status-area");
    const syncTitle = document.getElementById("sync-status-title");
    const syncDetail = document.getElementById("sync-status-detail");

    window.onload = function() {
      setupNavLinks();
      loadStudentMap();
      if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        window.speechSynthesis.getVoices();
      }
    };

    function setupNavLinks() {
      const navEl = document.getElementById("navLinks");
      if (!IS_GAS) {
        navEl.innerHTML = `
          <a href="manual.html" class="nav-pill">📋 เช็คชื่อ Manual</a>
          <a href="leave.html" class="nav-pill">📝 แจ้งลาออนไลน์</a>
        `;
      } else if (GAS_API_URL.includes("/macros/s/") && !GAS_API_URL.includes("ใส่_DEPLOYMENT_ID")) {
        navEl.innerHTML = `
          <a href="${GAS_API_URL}?page=manual" target="_top" class="nav-pill">📋 เช็คชื่อ Manual</a>
          <a href="${GAS_API_URL}?page=leave" target="_top" class="nav-pill">📝 แจ้งลาออนไลน์</a>
        `;
      }
    }

    // ==================== ระบบเสียงสัญญาณและเสียงพูดภาษาไทย ====================
    function ensureAudioUnlocked() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!sharedAudioCtx && AudioCtx) {
          sharedAudioCtx = new AudioCtx();
        }
        if (sharedAudioCtx && sharedAudioCtx.state === "suspended") {
          sharedAudioCtx.resume();
        }
      } catch (e) {}
    }

    function playBeep(type) {
      try {
        ensureAudioUnlocked();
        if (!sharedAudioCtx) return;
        const now = sharedAudioCtx.currentTime;
        const osc = sharedAudioCtx.createOscillator();
        const gain = sharedAudioCtx.createGain();
        osc.connect(gain);
        gain.connect(sharedAudioCtx.destination);

        if (type === "error") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(280, now);
          gain.gain.setValueAtTime(0.18, now);
          osc.start(now);
          osc.stop(now + 0.25);
        } else {
          // เสียงติ๊ดสั้นใส 2 จังหวะเมื่อสแกนสำเร็จ
          osc.type = "sine";
          osc.frequency.setValueAtTime(1050, now);
          osc.frequency.setValueAtTime(1400, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      } catch (e) {}
    }

    function unlockSpeech() {
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const silent = new SpeechSynthesisUtterance("");
          silent.volume = 0;
          window.speechSynthesis.speak(silent);
        }
      } catch (e) {}
    }

    function speakThai(text) {
      try {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "th-TH";
        utter.rate = 1.0;
        utter.pitch = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const thaiVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes("th"));
        if (thaiVoice) utter.voice = thaiVoice;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    // ==================== โหลดฐานข้อมูลนักเรียน ====================
    async function loadStudentMap() {
      try {
        const cached = localStorage.getItem("wpt_student_map_v1");
        if (cached) {
          studentMap = JSON.parse(cached);
          const count = Object.keys(studentMap).length;
          if (count > 0) {
            dbStatus.textContent = `🟢 พร้อมใช้งาน (${count} คน - กำลังอัปเดตล่าสุด...)`;
          }
        }
      } catch (e) {}

      try {
        let freshData = {};
        if (IS_GAS) {
          freshData = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getStudentDataMap();
          });
        } else {
          const response = await fetch(`${GAS_API_URL}?action=getStudentMap`, { method: "GET", redirect: "follow" });
          const json = await response.json();
          if (json.status !== "success") throw new Error(json.message || "โหลดข้อมูลไม่สำเร็จ");
          freshData = json.data || {};
        }

        studentMap = freshData;
        const count = Object.keys(studentMap).length;
        dbStatus.textContent = `🟢 พร้อมใช้งาน (ฐานข้อมูล ${count} คน)`;
        try { localStorage.setItem("wpt_student_map_v1", JSON.stringify(studentMap)); } catch (e) {}
      } catch (err) {
        const count = Object.keys(studentMap).length;
        dbStatus.textContent = count > 0
          ? `🟡 โหมดออฟไลน์ชั่วคราว (ใช้ข้อมูลแคช ${count} คน)`
          : "❌ โหลดฐานข้อมูลนักเรียนไม่สำเร็จ กรุณาตรวจสอบ GAS_API_URL";
      }
    }

    input.addEventListener("keyup", e => {
      if (e.key === "Enter") handleManualSaveClick();
    });

    document.addEventListener("click", (e) => {
      if (!isCameraRunning && !e.target.closest("button, a, #qrFullscreenModal")) {
        input.focus();
      }
    });

    function findStudentByCode(code) {
      if (studentMap[code]) return studentMap[code];
      const keys = Object.keys(studentMap);
      for (let i = 0; i < keys.length; i++) {
        if (String(studentMap[keys[i]].studentId).trim() === code) {
          return studentMap[keys[i]];
        }
      }
      return null;
    }

    function handleManualSaveClick() {
      ensureAudioUnlocked();
      unlockSpeech();
      sendData(input.value, true);
    }

    function showFullscreenToast(statusMsg, nameMsg, subMsg, type) {
      const toast = document.getElementById("qrScanToast");
      document.getElementById("qrToastStatus").textContent = statusMsg;
      document.getElementById("qrToastName").textContent = nameMsg;
      document.getElementById("qrToastSub").textContent = subMsg;
      toast.className = "qr-scan-toast show " + type;

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3200);
    }

    function sendData(directCode, speakOnSave = false) {
      const val = (typeof directCode === "string" ? directCode : input.value).trim();
      if (!val) return;

      input.value = "";
      if (!isCameraRunning) input.focus();

      const studentInfo = findStudentByCode(val);

      if (!studentInfo) {
        playBeep("error");
        resArea.className = "error";
        statusText.innerHTML = "❌ ไม่สำเร็จ";
        nameText.textContent = "ไม่พบข้อมูลรหัส: " + val;
        noText.textContent = "";

        if (isCameraRunning) {
          showFullscreenToast("❌ ไม่พบข้อมูลในระบบ", "รหัส: " + val, "กรุณาตรวจสอบ QR Code อีกครั้ง", "err");
        }
        return;
      }

      // เสียงสัญญาณและแสดงข้อมูลนักเรียนทันที
      playBeep("success");

      resArea.className = "success";
      statusText.innerHTML = "✅ บันทึกสำเร็จ (กำลังซิงค์...)";
      nameText.textContent = studentInfo.name;
      noText.textContent = "ชั้น: " + studentInfo.className + " เลขที่: " + studentInfo.no;

      if (isCameraRunning) {
        showFullscreenToast(
          "✅ เช็คชื่อสำเร็จ (กำลังบันทึก...)",
          studentInfo.name,
          `ชั้น ${studentInfo.className} | เลขที่ ${studentInfo.no} | รหัส ${studentInfo.studentId}`,
          "ok"
        );
      }

      const currentName = studentInfo.name;
      setTimeout(() => {
        if (nameText.textContent === currentName) {
          resArea.style.display = "none";
        }
      }, 3000);

      saveScanToBackend(val, studentInfo)
        .then(res => {
          if (res && res.status === "success") {
            if (nameText.textContent === currentName) {
              statusText.innerHTML = "✅ บันทึกสำเร็จและซิงค์แล้ว";
            }
            if (speakOnSave) {
              speakThai("บันทึกสำเร็จเรียบร้อย");
            }
          } else {
            if (nameText.textContent === currentName) {
              resArea.className = "error";
              statusText.innerHTML = "❌ ซิงค์ข้อมูลลงชีตล้มเหลว";
              nameText.textContent = (res && res.message) ? res.message : "กรุณาสแกนซ้ำอีกครั้ง";
            }
          }
        })
        .catch(() => {
          if (nameText.textContent === currentName) {
            resArea.className = "error";
            statusText.innerHTML = "❌ การซิงค์ขัดข้อง";
            nameText.textContent = "กรุณาสแกนรหัสนี้ใหม่อีกครั้งเพื่อความชัวร์";
          }
        });
    }

    async function saveScanToBackend(qrData, studentInfo) {
      if (IS_GAS) {
        return new Promise((resolve, reject) => {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveData(qrData, studentInfo);
        });
      }
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "saveScan", qrData, studentInfo }),
        redirect: "follow"
      });
      return res.json();
    }

    // ==================== หน้าต่างกล้องสแกน QR Code เต็มจอ ====================
    async function openFullscreenScanner() {
      ensureAudioUnlocked();
      unlockSpeech();

      if (typeof Html5Qrcode === "undefined") {
        alert("ไม่สามารถโหลดไลบรารีสแกน QR Code ได้ กรุณาตรวจสอบอินเทอร์เน็ต");
        return;
      }

      const modal = document.getElementById("qrFullscreenModal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      resetCameraControlsUI();

      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("qr-reader");
        }

        const config = {
          fps: 12,
          qrbox: function(viewfinderWidth, viewfinderHeight) {
            const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
            const boxSize = Math.max(180, Math.floor(minEdge * 0.65));
            return { width: boxSize, height: boxSize };
          }
        };

        const onSuccess = (decodedText) => {
          const code = decodedText.trim();
          const now = Date.now();
          if (code === lastScannedCode && (now - lastScannedTime) < 3000) return;
          lastScannedCode = code;
          lastScannedTime = now;
          sendData(code, false);
        };

        try {
          await html5QrCode.start({ facingMode: "environment" }, config, onSuccess, () => {});
        } catch (envErr) {
          const cameras = await Html5Qrcode.getCameras();
          if (!cameras || cameras.length === 0) throw new Error("ไม่พบกล้องในอุปกรณ์นี้");
          await html5QrCode.start(cameras[0].id, config, onSuccess, () => {});
        }

        isCameraRunning = true;
        setTimeout(() => initCameraHardwareCapabilities(), 350);
      } catch (err) {
        await closeFullscreenScanner();
        resArea.className = "error";
        statusText.innerHTML = "❌ เปิดกล้องไม่สำเร็จ";
        nameText.textContent = "กรุณาอนุญาตสิทธิ์การใช้กล้อง หรือเปิดผ่านลิงก์ GitHub Pages (HTTPS)";
        noText.textContent = err.message || "";
      }
    }

    function resetCameraControlsUI() {
      activeVideoTrack = null;
      isTorchOn = false;
      torchSupported = false;
      zoomSupported = false;

      const torchBtn = document.getElementById("torchBtn");
      torchBtn.classList.remove("torch-on");
      torchBtn.disabled = false;
      torchBtn.textContent = "🔦 ไฟฉาย";

      document.getElementById("zoomControlsBox").style.display = "block";
      document.getElementById("zoomUnsupportedNote").style.display = "none";
      document.getElementById("zoomValueLabel").textContent = "1.0x";
      document.getElementById("zoomSlider").value = 1;
      document.getElementById("qrScanToast").classList.remove("show");
    }

    function initCameraHardwareCapabilities() {
      const videoEl = document.querySelector("#qr-reader video");
      if (!videoEl || !videoEl.srcObject) return;

      const tracks = videoEl.srcObject.getVideoTracks();
      if (!tracks || tracks.length === 0) return;
      activeVideoTrack = tracks[0];

      const caps = (typeof activeVideoTrack.getCapabilities === "function")
        ? activeVideoTrack.getCapabilities()
        : {};

      // ตรวจสอบการรองรับไฟฉาย (Torch)
      torchSupported = Boolean(caps.torch);
      const torchBtn = document.getElementById("torchBtn");
      if (!torchSupported) {
        torchBtn.style.opacity = "0.55";
      } else {
        torchBtn.style.opacity = "1";
      }

      // ตรวจสอบการรองรับการซูมฮาร์ดแวร์ (Zoom)
      if (caps.zoom && typeof caps.zoom.min === "number" && typeof caps.zoom.max === "number" && caps.zoom.max > caps.zoom.min) {
        zoomSupported = true;
        zoomRange = {
          min: caps.zoom.min,
          max: Math.min(caps.zoom.max, 6),
          step: caps.zoom.step || 0.1
        };

        const slider = document.getElementById("zoomSlider");
        slider.min = zoomRange.min;
        slider.max = zoomRange.max;
        slider.step = zoomRange.step;
        slider.value = zoomRange.min;
        document.getElementById("zoomValueLabel").textContent = zoomRange.min.toFixed(1) + "x";
        document.getElementById("zoomControlsBox").style.display = "block";
        document.getElementById("zoomUnsupportedNote").style.display = "none";
      } else {
        zoomSupported = false;
        document.getElementById("zoomControlsBox").style.display = "none";
        document.getElementById("zoomUnsupportedNote").style.display = "block";
      }
    }

    async function setZoomLevel(level) {
      if (!zoomSupported || !activeVideoTrack) return;
      const clamped = Math.max(zoomRange.min, Math.min(zoomRange.max, level));
      try {
        await activeVideoTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
        document.getElementById("zoomSlider").value = clamped;
        document.getElementById("zoomValueLabel").textContent = clamped.toFixed(1) + "x";

        document.querySelectorAll("#zoomPresets .zoom-pill").forEach(btn => {
          const val = parseFloat(btn.textContent);
          btn.classList.toggle("active", Math.abs(val - clamped) < 0.2);
        });
      } catch (e) {}
    }

    async function toggleTorch() {
      if (!activeVideoTrack || !torchSupported) {
        showFullscreenToast("⚠️ ไม่รองรับไฟฉาย", "อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับการเปิดไฟฉาย", "แนะนำใช้งานบน Chrome (Android)", "err");
        return;
      }
      try {
        const nextState = !isTorchOn;
        await activeVideoTrack.applyConstraints({ advanced: [{ torch: nextState }] });
        isTorchOn = nextState;
        const torchBtn = document.getElementById("torchBtn");
        torchBtn.classList.toggle("torch-on", isTorchOn);
        torchBtn.textContent = isTorchOn ? "🔦 ปิดไฟฉาย" : "🔦 ไฟฉาย";
      } catch (e) {
        showFullscreenToast("⚠️ เปิดไฟฉายไม่สำเร็จ", "กล้องปัจจุบันไม่รองรับคำสั่งไฟฉาย", "", "err");
      }
    }

    async function closeFullscreenScanner() {
      if (activeVideoTrack && isTorchOn) {
        try {
          await activeVideoTrack.applyConstraints({ advanced: [{ torch: false }] });
        } catch (e) {}
      }
      if (html5QrCode && isCameraRunning) {
        try {
          await html5QrCode.stop();
          await html5QrCode.clear();
        } catch (e) {}
      }
      isCameraRunning = false;
      activeVideoTrack = null;
      isTorchOn = false;

      const modal = document.getElementById("qrFullscreenModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    // ==================== ซิงค์ข้อมูลไปเว็บโรงเรียนทั้งห้อง ====================
    async function syncAllToSchoolWeb() {
      ensureAudioUnlocked();
      unlockSpeech();

      syncBtn.disabled = true;
      syncBtn.textContent = "⏳ กำลังซิงค์ข้อมูลไปเว็บโรงเรียน...";
      syncArea.className = "pending";
      syncTitle.textContent = "⏳ กำลังเช็คชื่อเปิดวันและซิงค์ข้อมูลทั้งห้อง...";
      syncDetail.textContent = "กรุณารอสักครู่ (ใช้เวลาประมาณ 5-15 วินาที)";

      try {
        let res;
        if (IS_GAS) {
          res = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).syncTodayFromWebApp();
          });
        } else {
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "syncToday" }),
            redirect: "follow"
          });
          res = await response.json();
        }

        if (res && res.status === "success") {
          syncArea.className = "success";
          syncTitle.textContent = "✅ ซิงค์เช็คชื่อวันนี้ไปเว็บโรงเรียน (ทั้งห้อง) เรียบร้อยแล้ว";
          syncDetail.textContent = res.detail || "";
          speakThai("บันทึกสำเร็จเรียบร้อย");
        } else {
          syncArea.className = "error";
          syncTitle.textContent = "❌ ซิงค์ข้อมูลไม่สำเร็จ";
          syncDetail.textContent = (res && res.message) ? res.message : "กรุณาลองใหม่อีกครั้ง";
        }
      } catch (err) {
        syncArea.className = "error";
        syncTitle.textContent = "❌ การเชื่อมต่อขัดข้อง";
        syncDetail.textContent = "ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณากดซิงค์ใหม่อีกครั้ง";
      } finally {
        syncBtn.disabled = false;
        syncBtn.textContent = "🌐 ซิงค์เช็คชื่อวันนี้ไปเว็บโรงเรียน (ทั้งห้อง)";
      }
    }
  </script>
