<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแจ้งลาออนไลน์ - กิจกรรมหน้าเสาธง</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f1f3f4;
      margin: 0;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background-color: #ffffff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-sizing: border-box;
    }
    h2 { color: #1a73e8; margin-top: 0; margin-bottom: 20px; font-size: 1.4em; line-height: 1.3; }
    label { display: block; text-align: left; font-size: 14px; font-weight: 500; color: #3c4043; margin-bottom: 6px; margin-top: 14px; }
    input[type="text"], input[type="date"], textarea {
      width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px;
      font-size: 16px; font-family: 'Prompt', sans-serif; outline: none; box-sizing: border-box;
    }
    input[type="text"]:focus, input[type="date"]:focus, textarea:focus { border: 2px solid #1a73e8; }
    textarea { resize: vertical; min-height: 80px; }

    .student-info-box {
      background-color: #e8f0fe; border: 1px solid #d2e3fc; border-radius: 8px;
      padding: 12px 15px; text-align: left; margin-bottom: 15px;
    }
    .student-info-box div { font-size: 14px; color: #1967d2; margin: 3px 0; }
    .student-info-box strong { color: #174ea6; font-weight: 600; }

    .leave-type-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px; }
    .leave-btn {
      background-color: #f8f9fa; color: #3c4043; border: 1px solid #dadce0;
      padding: 10px 6px; border-radius: 8px; font-size: 14px; font-family: 'Prompt', sans-serif;
      cursor: pointer; transition: all 0.2s; font-weight: 500;
    }
    .leave-btn:hover { background-color: #e8eaed; }
    .leave-btn.active {
      background-color: #1a73e8; color: #ffffff; border-color: #1a73e8;
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.3);
    }

    .action-group { display: flex; gap: 10px; margin-top: 22px; }
    .btn-primary {
      flex: 1; background-color: #1a73e8; color: white; padding: 12px;
      border: none; border-radius: 8px; font-size: 16px; font-family: 'Prompt', sans-serif;
      cursor: pointer; font-weight: 500;
    }
    .btn-primary:hover { background-color: #1557b0; }
    .btn-primary:disabled { background-color: #9aa0a6; cursor: not-allowed; }
    .btn-cancel {
      flex: 1; background-color: #f1f3f4; color: #3c4043; padding: 12px;
      border: 1px solid #dadce0; border-radius: 8px; font-size: 16px; font-family: 'Prompt', sans-serif;
      cursor: pointer; font-weight: 500;
    }
    .btn-cancel:hover { background-color: #e8eaed; }

    .alert-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    .alert-success { background-color: #e6f4ea; border: 1px solid #1e8e3e; color: #137333; display: block; }
    .alert-error { background-color: #fce8e6; border: 1px solid #d93025; color: #c5221f; display: block; }
    .hidden { display: none !important; }
    .footer { margin-top: 25px; font-size: 11px; color: #70757a; }
  </style>
</head>
<body>

  <div class="card">
    <div id="login-section">
      <h2>📝 ระบบแจ้งลาออนไลน์<br>กิจกรรมหน้าเสาธง</h2>
      <label for="usernameInput">ยืนยันตัวตน (Username)</label>
      <input type="text" id="usernameInput" placeholder="กรอกเลขประจำตัวนักเรียน..." style="text-align: center; font-size: 18px;" autofocus>
      <div class="action-group">
        <button id="loginBtn" class="btn-primary" onclick="handleLogin()">เข้าสู่ระบบแจ้งลา</button>
      </div>
    </div>

    <div id="leave-section" class="hidden">
      <h2>📋 แบบฟอร์มการแจ้งลา</h2>
      <div class="student-info-box">
        <div><strong>เลขประจำตัว:</strong> <span id="info-id"></span></div>
        <div><strong>ชื่อ-นามสกุล:</strong> <span id="info-name"></span></div>
        <div><strong>ชั้น:</strong> <span id="info-class"></span> &nbsp;|&nbsp; <strong>เลขที่:</strong> <span id="info-no"></span></div>
      </div>

      <label>1. เลือกประเภทการลา</label>
      <div class="leave-type-group">
        <button type="button" class="leave-btn" onclick="selectLeaveType('ลากิจ', this)">ลากิจ</button>
        <button type="button" class="leave-btn" onclick="selectLeaveType('ลาป่วย', this)">ลาป่วย</button>
        <button type="button" class="leave-btn" onclick="selectLeaveType('เข้าร่วมกิจกรรม', this)">เข้าร่วมกิจกรรม</button>
      </div>

      <label for="leaveDate">2. วันที่ต้องการลา</label>
      <input type="date" id="leaveDate">

      <label for="leaveReason">3. เหตุผลในการลา</label>
      <textarea id="leaveReason" placeholder="ระบุเหตุผลการลา หรือชื่อกิจกรรมที่เข้าร่วม..."></textarea>

      <div class="action-group">
        <button type="button" id="submitBtn" class="btn-primary" onclick="handleSubmitLeave()">ตกลง</button>
        <button type="button" class="btn-cancel" onclick="handleCancel()">ยกเลิก</button>
      </div>
    </div>

    <div id="alertBox" class="alert-box"></div>
  </div>

  <div class="footer">จัดทำโดย คุณครูธนโชติ จันทรังษี โรงเรียนวาปีปทุม</div>

  <script>
    // ================== ตั้งค่า URL Web App ของ Google Apps Script ==================
    const GAS_API_URL = "https://script.google.com/macros/s/ใส่_DEPLOYMENT_ID_เดิมของคุณครูที่นี่/exec";
    const IS_GAS = (typeof google !== "undefined" && google.script && google.script.run);

    let currentStudent = null;
    let selectedLeaveType = "";

    window.onload = function() {
      setTodayDate();
      document.getElementById("usernameInput").addEventListener("keyup", function(e) {
        if (e.key === "Enter") handleLogin();
      });
    };

    function setTodayDate() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById("leaveDate").value = `${yyyy}-${mm}-${dd}`;
    }

    function showAlert(message, type) {
      const alertBox = document.getElementById("alertBox");
      alertBox.textContent = message;
      alertBox.className = "alert-box " + (type === "success" ? "alert-success" : "alert-error");
    }

    function clearAlert() {
      const alertBox = document.getElementById("alertBox");
      alertBox.className = "alert-box";
      alertBox.textContent = "";
    }

    async function handleLogin() {
      const studentId = document.getElementById("usernameInput").value.trim();
      if (!studentId) {
        showAlert("⚠️ กรุณากรอกเลขประจำตัวนักเรียน", "error");
        return;
      }

      clearAlert();
      const loginBtn = document.getElementById("loginBtn");
      loginBtn.disabled = true;
      loginBtn.textContent = "กำลังตรวจสอบ...";

      try {
        let res;
        if (IS_GAS) {
          res = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).verifyStudentForLeave(studentId);
          });
        } else {
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "verifyStudentForLeave", studentId }),
            redirect: "follow"
          });
          res = await response.json();
        }

        if (res.status === "success") {
          currentStudent = res.student;
          document.getElementById("info-id").textContent = currentStudent.studentId;
          document.getElementById("info-name").textContent = currentStudent.name || "-";
          document.getElementById("info-class").textContent = currentStudent.className || "-";
          document.getElementById("info-no").textContent = currentStudent.no || "-";
          document.getElementById("login-section").classList.add("hidden");
          document.getElementById("leave-section").classList.remove("hidden");
        } else {
          showAlert("❌ " + res.message, "error");
        }
      } catch (err) {
        showAlert("❌ การเชื่อมต่อขัดข้อง กรุณาลองใหม่อีกครั้ง", "error");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "เข้าสู่ระบบแจ้งลา";
      }
    }

    function selectLeaveType(type, btnElement) {
      selectedLeaveType = type;
      document.querySelectorAll(".leave-btn").forEach(btn => btn.classList.remove("active"));
      btnElement.classList.add("active");
      clearAlert();
    }

    async function handleSubmitLeave() {
      if (!selectedLeaveType) {
        showAlert("⚠️ กรุณาเลือกประเภทการลา (ลากิจ / ลาป่วย / เข้าร่วมกิจกรรม)", "error");
        return;
      }
      const rawDate = document.getElementById("leaveDate").value;
      if (!rawDate) {
        showAlert("⚠️ กรุณาเลือกวันที่ต้องการลา", "error");
        return;
      }
      const reason = document.getElementById("leaveReason").value.trim();
      if (!reason) {
        showAlert("⚠️ กรุณาระบุเหตุผลในการลา", "error");
        return;
      }

      const parts = rawDate.split("-");
      const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังบันทึก...";
      clearAlert();

      const leaveData = {
        studentId: currentStudent.studentId,
        leaveType: selectedLeaveType,
        dateStr: formattedDate,
        reason: reason
      };

      try {
        let res;
        if (IS_GAS) {
          res = await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitLeaveRequest(leaveData);
          });
        } else {
          const response = await fetch(GAS_API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "submitLeaveRequest", leaveData }),
            redirect: "follow"
          });
          res = await response.json();
        }

        if (res.status === "success") {
          showAlert("✅ " + res.message, "success");
          setTimeout(() => { handleCancel(); }, 2500);
        } else {
          showAlert("❌ " + res.message, "error");
        }
      } catch (err) {
        showAlert("❌ เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "ตกลง";
      }
    }

    function handleCancel() {
      currentStudent = null;
      selectedLeaveType = "";
      document.getElementById("usernameInput").value = "";
      document.getElementById("leaveReason").value = "";
      setTodayDate();
      document.querySelectorAll(".leave-btn").forEach(btn => btn.classList.remove("active"));
      clearAlert();
      document.getElementById("leave-section").classList.add("hidden");
      document.getElementById("login-section").classList.remove("hidden");
      document.getElementById("usernameInput").focus();
    }
  </script>
</body>
</html>
